<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>갈틱폰(Gartic Phone) 가상 캔버스 환경</title>
    <style>
        :root {
            --panel-bg: rgba(28, 32, 60, 0.92);
            --panel-border: rgba(99, 102, 241, 0.25);
            --accent-blue: #3b82f6;
            --accent-hover: #60a5fa;
            --accent-coral: #ef4444;
            --accent-coral-hover: #f87171;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* -------------------------------------------------------------
           듀얼 캔버스 레이어 아키텍처
           1) #garticCanvas : 최종 확정 그림이 저장되는 메인 캔버스
           2) #draftCanvas  : 실시간 스트로크 누적용 오버레이 캔버스 (투명도 중첩 방지)
           ------------------------------------------------------------- */
        #garticCanvas, #draftCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            cursor: crosshair;
        }

        #garticCanvas {
            background-color: #ffffff;
            z-index: 1;
        }

        #draftCanvas {
            background-color: transparent;
            pointer-events: none; /* 마우스 이벤트가 아래 메인 캔버스로 온전히 통과 */
            z-index: 2;
        }

        /* -------------------------------------------------------------
           UI 오버레이: 캔버스 위에 플로팅되는 툴바 및 컨트롤 패널
           ------------------------------------------------------------- */
        .tools-panel {
            position: fixed;
            top: 16px;
            left: 16px;
            width: 310px;
            max-height: calc(100vh - 32px);
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 13px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            color: var(--text-main);
            z-index: 100;
            overflow-y: auto;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .tools-panel::-webkit-scrollbar {
            width: 5px;
        }
        .tools-panel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .panel-header h2 {
            margin: 0;
            font-size: 15px;
            font-weight: 800;
            color: #60a5fa;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-fs {
            background-color: #1e3a8a;
            color: #bfdbfe;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
        }

        .tool-section {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .tool-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tool-val {
            color: var(--accent-blue);
            font-weight: 800;
            font-size: 12px;
        }

        /* 버튼 및 프리셋 */
        .btn-group {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: rgba(43, 50, 92, 0.85);
            color: var(--text-main);
            border: 1px solid transparent;
            border-radius: 7px;
            padding: 6px 9px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            flex: 1;
            text-align: center;
            white-space: nowrap;
        }

        .btn:hover {
            background-color: rgba(59, 68, 122, 0.95);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn.active {
            background-color: var(--accent-blue);
            color: #ffffff;
            border-color: #93c5fd;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .btn-danger {
            background-color: #991b1b;
            color: #fee2e2;
        }
        .btn-danger:hover {
            background-color: var(--accent-coral);
            color: #ffffff;
        }

        .btn-action {
            background-color: #1e3a8a;
            color: #bfdbfe;
        }
        .btn-action:hover {
            background-color: #2563eb;
            color: #ffffff;
        }

        .btn-success {
            background-color: #065f46;
            color: #a7f3d0;
        }
        .btn-success:hover {
            background-color: #059669;
            color: #ffffff;
        }

        .btn-purple {
            background-color: #581c87;
            color: #f3e8ff;
        }
        .btn-purple:hover {
            background-color: #7e22ce;
            color: #ffffff;
        }

        /* 슬라이더 및 넘버 박스 컨트롤 */
        .slider-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .num-box-wrapper {
            display: flex;
            align-items: center;
            background: #111425;
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 2px 6px;
            flex-shrink: 0;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .num-box-wrapper:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 6px rgba(59, 130, 246, 0.4);
        }

        .num-box-wrapper input[type="number"] {
            width: 44px;
            background: transparent;
            border: none;
            color: var(--accent-blue);
            font-weight: 800;
            font-size: 13px;
            text-align: right;
            outline: none;
            -moz-appearance: textfield;
            padding: 2px 1px;
        }

        .num-box-wrapper input[type="number"]::-webkit-inner-spin-button,
        .num-box-wrapper input[type="number"]::-webkit-outer-spin-button {
            opacity: 0.7;
            cursor: pointer;
        }

        .num-box-wrapper .unit {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            margin-left: 3px;
            user-select: none;
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--accent-blue);
            height: 5px;
            background: #111425;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        /* 브러시 미리보기 박스 */
        .brush-preview-box {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            background: rgba(17, 20, 37, 0.8);
            border-radius: 8px;
            border: 1px dashed var(--panel-border);
            overflow: hidden;
        }

        .brush-preview-circle {
            background-color: #000000;
            border-radius: 50%;
            transition: width 0.1s, height 0.1s, opacity 0.1s, background-color 0.1s;
        }

        /* 색상 팔레트 그리드 */
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
        }

        .color-dot {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            box-shadow: inset 0 0 2px rgba(0,0,0,0.5);
            transition: transform 0.1s, border-color 0.1s;
        }

        .color-dot:hover {
            transform: scale(1.15);
        }

        .color-dot.active {
            border-color: #ffffff;
            box-shadow: 0 0 8px #ffffff;
            transform: scale(1.1);
        }

        .custom-color-picker {
            width: 100%;
            height: 28px;
            padding: 2px 4px;
            background-color: #111425;
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            cursor: pointer;
        }

        /* -------------------------------------------------------------
           하단 정보 바 (플로팅 HUD)
           ------------------------------------------------------------- */
        .info-bar {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 7px 16px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 14px;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            z-index: 100;
            white-space: nowrap;
            transition: opacity 0.2s ease;
        }

        .info-item b {
            color: #38bdf8;
        }

        .copy-btn {
            background-color: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 4px;
            font-weight: 700;
        }
        .copy-btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }

        /* -------------------------------------------------------------
           우측 상단 플로팅 컨트롤 (UI 토글 및 전체화면)
           ------------------------------------------------------------- */
        .floating-controls {
            position: fixed;
            top: 14px;
            right: 14px;
            display: flex;
            gap: 8px;
            z-index: 100;
            transition: opacity 0.2s ease;
        }

        .float-btn {
            background-color: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #e2e8f0;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .float-btn:hover {
            background-color: var(--accent-blue);
            color: #ffffff;
            border-color: #93c5fd;
            transform: translateY(-1px);
        }

        .float-btn.active-fs {
            background-color: #2563eb;
            color: #ffffff;
            border-color: #60a5fa;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.6);
        }

        /* -------------------------------------------------------------
           UI 숨김 모드 (Tab / H): 오버레이를 전부 감추어 순수 100% 캔버스화
           ------------------------------------------------------------- */
        body.ui-hidden .tools-panel,
        body.ui-hidden .info-bar {
            display: none !important;
        }

        body.ui-hidden .floating-controls {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .hover-zone-topright {
            position: fixed;
            top: 0;
            right: 0;
            width: 160px;
            height: 60px;
            z-index: 99;
            display: none;
        }

        body.ui-hidden .hover-zone-topright {
            display: block;
        }

        body.ui-hidden .hover-zone-topright:hover + .floating-controls,
        body.ui-hidden .floating-controls:hover {
            opacity: 0.95;
            pointer-events: auto;
        }

        /* 토스트 알림 메시지 */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translate(-50%, 15px);
            background-color: rgba(15, 23, 42, 0.96);
            color: #38bdf8;
            border: 1px solid #0284c7;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 8px 28px rgba(0,0,0,0.7);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 10000;
            text-align: center;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>
</head>
<body>

    <!-- 1. 메인 캔버스: 영구 저장용 흰색 배경 캔버스 -->
    <canvas id="garticCanvas"></canvas>

    <!-- 2. 드래프트 캔버스: 실시간 스트로크 드로잉용 (점 중첩 투명도 누적 방지) -->
    <canvas id="draftCanvas"></canvas>

    <!-- UI 숨김 상태에서 마우스로 우측 상단 접근 시 복원 버튼을 표시해주는 감지 구역 -->
    <div class="hover-zone-topright" id="hoverZone"></div>

    <!-- 3. 우측 상단 플로팅 컨트롤 (UI 토글 및 모니터 전체화면) -->
    <div class="floating-controls" id="floatingControls">
        <button class="float-btn" id="btnFloatUI" onclick="toggleUI()" title="UI 표시/숨김 (단축키: Tab 또는 H)">
            <span id="uiToggleIcon">👁️</span> <span id="uiToggleText">UI 숨기기 (Tab)</span>
        </button>
        <button class="float-btn" id="btnFloatFS" onclick="toggleFullscreen()" title="모니터 화면 전체를 캔버스로 채우기 (단축키: F11)">
            <span id="fsIcon">🖥️</span> <span id="fsText">모니터 전체화면 (F11)</span>
        </button>
    </div>

    <!-- 4. 좌측 플로팅 조작 도구 패널 (Canvas Overlay) -->
    <div class="tools-panel" id="toolsPanel">
        <div class="panel-header">
            <h2>🎨 Gartic 캔버스 보드</h2>
            <span class="badge-fs" id="badgeFS">전체화면 캔버스</span>
        </div>

        <!-- 캔버스 해상도 정보 및 제어 -->
        <div class="tool-section">
            <div class="tool-title">
                <span>캔버스 해상도</span>
                <span class="tool-val" id="resVal">계산 중...</span>
            </div>
            <button class="btn btn-purple" id="btnToggleFS" onclick="toggleFullscreen()" title="모니터 전체화면으로 전환 (단축키: F11)">
                🖥️ 모니터 전체화면 (F11)
            </button>
        </div>

        <!-- 도구 선택 (펜 / 지우개) -->
        <div class="tool-section">
            <div class="tool-title">그리기 도구</div>
            <div class="btn-group">
                <button class="btn active" id="btnPen" onclick="setTool('pen')">
                    ✏️ 펜 (B)
                </button>
                <button class="btn" id="btnEraser" onclick="setTool('eraser')">
                    🧹 지우개 (E)
                </button>
            </div>
        </div>

        <!-- 페인팅 굵기 -->
        <div class="tool-section">
            <div class="tool-title">
                <span>페인팅 굵기</span>
                <span class="tool-val" id="sizeVal">4 px</span>
            </div>
            <div class="slider-container">
                <input type="range" id="sizeSlider" min="1" max="80" value="4" oninput="updateSize(this.value)">
                <div class="num-box-wrapper" title="사용자 지정 페인팅 굵기 (1~300 px)">
                    <input type="number" id="sizeInput" min="1" max="300" value="4" oninput="updateSize(this.value)">
                    <span class="unit">px</span>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn" onclick="updateSize(1)">1px</button>
                <button class="btn active" id="size4" onclick="updateSize(4)">4px</button>
                <button class="btn" id="size10" onclick="updateSize(10)">10px</button>
                <button class="btn" id="size24" onclick="updateSize(24)">24px</button>
                <button class="btn" id="size48" onclick="updateSize(48)">48px</button>
            </div>
        </div>

        <!-- 페인팅 투명도 (불투명도) -->
        <div class="tool-section">
            <div class="tool-title">
                <span>투명도 (불투명도)</span>
                <span class="tool-val" id="opacityVal">100%</span>
            </div>
            <div class="slider-container">
                <input type="range" id="opacitySlider" min="5" max="100" value="100" oninput="updateOpacity(this.value)">
                <div class="num-box-wrapper" title="사용자 지정 불투명도 (1~100 %)">
                    <input type="number" id="opacityInput" min="1" max="100" value="100" oninput="updateOpacity(this.value)">
                    <span class="unit">%</span>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn" onclick="updateOpacity(25)">25%</button>
                <button class="btn" onclick="updateOpacity(50)">50%</button>
                <button class="btn" onclick="updateOpacity(75)">75%</button>
                <button class="btn active" id="op100" onclick="updateOpacity(100)">100%</button>
            </div>
        </div>

        <!-- 브러시 미리보기 -->
        <div class="tool-section">
            <div class="tool-title">브러시 미리보기</div>
            <div class="brush-preview-box">
                <div class="brush-preview-circle" id="brushPreview" style="width: 4px; height: 4px; opacity: 1.0;"></div>
            </div>
        </div>

        <!-- 색상 팔레트 -->
        <div class="tool-section">
            <div class="tool-title">색상 팔레트</div>
            <div class="palette-grid" id="palette">
                <!-- 기본 갈틱폰 18색 -->
                <div class="color-dot active" style="background:#000000;" onclick="setColor('#000000', this)"></div>
                <div class="color-dot" style="background:#555555;" onclick="setColor('#555555', this)"></div>
                <div class="color-dot" style="background:#aaaaaa;" onclick="setColor('#aaaaaa', this)"></div>
                <div class="color-dot" style="background:#ffffff; border:1px solid #444;" onclick="setColor('#ffffff', this)"></div>
                <div class="color-dot" style="background:#ef4444;" onclick="setColor('#ef4444', this)"></div>
                <div class="color-dot" style="background:#f97316;" onclick="setColor('#f97316', this)"></div>

                <div class="color-dot" style="background:#eab308;" onclick="setColor('#eab308', this)"></div>
                <div class="color-dot" style="background:#22c55e;" onclick="setColor('#22c55e', this)"></div>
                <div class="color-dot" style="background:#06b6d4;" onclick="setColor('#06b6d4', this)"></div>
                <div class="color-dot" style="background:#3b82f6;" onclick="setColor('#3b82f6', this)"></div>
                <div class="color-dot" style="background:#a855f7;" onclick="setColor('#a855f7', this)"></div>
                <div class="color-dot" style="background:#ec4899;" onclick="setColor('#ec4899', this)"></div>

                <div class="color-dot" style="background:#78350f;" onclick="setColor('#78350f', this)"></div>
                <div class="color-dot" style="background:#b45309;" onclick="setColor('#b45309', this)"></div>
                <div class="color-dot" style="background:#14532d;" onclick="setColor('#14532d', this)"></div>
                <div class="color-dot" style="background:#1e3a8a;" onclick="setColor('#1e3a8a', this)"></div>
                <div class="color-dot" style="background:#581c87;" onclick="setColor('#581c87', this)"></div>
                <div class="color-dot" style="background:#fbcfe8;" onclick="setColor('#fbcfe8', this)"></div>
            </div>
            <input type="color" id="customColor" class="custom-color-picker" value="#000000" onchange="setColor(this.value)">
        </div>

        <!-- 캔버스 액션 (실행취소 / 초기화 / 이미지 저장) -->
        <div class="tool-section">
            <div class="tool-title">캔버스 제어</div>
            <div class="btn-group">
                <button class="btn btn-action" onclick="undo()" title="실행 취소 (Ctrl+Z)">↩ 실행 취소</button>
                <button class="btn btn-action" onclick="redo()" title="다시 실행 (Ctrl+Y)">↪ 다시 실행</button>
            </div>
            <button class="btn btn-danger" style="margin-top: 4px;" onclick="clearCanvas()" title="캔버스 전체 흰색 초기화 (C)">
                🗑️ 모두 초기화 (Clear All)
            </button>
            <div class="btn-group" style="margin-top: 4px;">
                <button class="btn btn-success" onclick="saveAsWebp()" title="고화질 WebP 파일로 다운로드 (Ctrl+S)">
                    🌐 WebP 저장
                </button>
                <button class="btn btn-action" onclick="saveAsPng()" title="무손실 PNG 파일로 다운로드">
                    💾 PNG 저장
                </button>
            </div>
        </div>
    </div>

    <!-- 5. 하단 플로팅 정보 바 (Canvas HUD) -->
    <div class="info-bar" id="infoBar">
        <div class="info-item">
            상태: <b id="modeInfo">전체화면 캔버스</b>
        </div>
        <div class="info-item">
            마우스: <b id="posInfo">X: 0, Y: 0</b>
        </div>
        <div class="info-item">
            획수: <b id="strokeCount">0</b> 개
        </div>
        <div class="info-item">
            점: <b id="pointCount">0</b> pt
        </div>
        <div class="info-item">
            수신: <b id="hzVal">0</b> Hz
        </div>
        <div class="info-item">
            <span>CANVAS_AREA: <b id="areaCoords">계산 중...</b></span>
            <button class="copy-btn" onclick="copyAreaCoords()" title="line_draw_setting.txt 에 넣을 좌표를 복사합니다.">좌표 복사</button>
        </div>
    </div>

    <!-- 알림 메시지 토스트 -->
    <div id="toast" class="toast"></div>

    <script>
        const mainCanvas = document.getElementById('garticCanvas');
        const mainCtx = mainCanvas.getContext('2d', { willReadFrequently: true });

        const draftCanvas = document.getElementById('draftCanvas');
        const draftCtx = draftCanvas.getContext('2d', { willReadFrequently: true });

        // 상태 변수
        let currentTool = 'pen'; // 'pen' 또는 'eraser'
        let currentColor = '#000000';
        let currentSize = 4;
        let currentOpacity = 1.0;
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let isUIHidden = false;

        // 히스토리 관리 (GPU 가속 스냅샷 방식)
        let totalStrokes = 0;
        let totalPoints = 0;
        let historyStack = [];
        let redoStack = [];
        const MAX_HISTORY = 25;

        // 이벤트 수신율(Hz) 측정
        let mouseEventsThisSecond = 0;
        let lastSecondTime = performance.now();

        // -------------------------------------------------------------
        // 캔버스 초기화: 메인 및 드래프트 캔버스를 화면 전체로 설정
        // -------------------------------------------------------------
        function initCanvas() {
            const w = window.innerWidth;
            const h = window.innerHeight;

            mainCanvas.width = w;
            mainCanvas.height = h;
            draftCanvas.width = w;
            draftCanvas.height = h;

            mainCtx.fillStyle = '#ffffff';
            mainCtx.fillRect(0, 0, w, h);
            mainCtx.lineCap = 'round';
            mainCtx.lineJoin = 'round';

            draftCtx.lineCap = 'round';
            draftCtx.lineJoin = 'round';
            draftCanvas.style.opacity = currentOpacity;

            historyStack = [];
            redoStack = [];
            saveState();

            updateSize(currentSize);
            updateOpacity(Math.round(currentOpacity * 100));
            updateDimensionDisplay();
            setTimeout(updateAreaCoords, 100);
        }

        // 히스토리 상태 스냅샷 저장
        function saveState() {
            redoStack = [];
            if (historyStack.length >= MAX_HISTORY) {
                historyStack.shift();
            }
            const snap = document.createElement('canvas');
            snap.width = mainCanvas.width;
            snap.height = mainCanvas.height;
            const sCtx = snap.getContext('2d');
            sCtx.drawImage(mainCanvas, 0, 0);
            historyStack.push(snap);
        }

        // 화면 크기 변경 시 캔버스도 화면 전체를 항상 유지 (기존 그림 보존)
        function handleResize() {
            const newW = window.innerWidth;
            const newH = window.innerHeight;
            if (mainCanvas.width === newW && mainCanvas.height === newH) return;

            // 기존 그림 임시 보관
            const temp = document.createElement('canvas');
            temp.width = mainCanvas.width;
            temp.height = mainCanvas.height;
            const tempCtx = temp.getContext('2d');
            tempCtx.drawImage(mainCanvas, 0, 0);

            // 새 전체화면 크기로 해상도 확장
            mainCanvas.width = newW;
            mainCanvas.height = newH;
            draftCanvas.width = newW;
            draftCanvas.height = newH;

            // 컨텍스트 리셋 복구
            mainCtx.fillStyle = '#ffffff';
            mainCtx.fillRect(0, 0, newW, newH);
            mainCtx.lineCap = 'round';
            mainCtx.lineJoin = 'round';

            draftCtx.lineCap = 'round';
            draftCtx.lineJoin = 'round';
            draftCanvas.style.opacity = currentOpacity;

            // 기존 그림 복원
            mainCtx.drawImage(temp, 0, 0);

            historyStack = [];
            redoStack = [];
            saveState();

            updateDimensionDisplay();
            updateAreaCoords();
        }

        window.addEventListener('resize', handleResize);

        // 해상도 텍스트 표시 갱신
        function updateDimensionDisplay() {
            const isFS = !!document.fullscreenElement;
            const resStr = `${mainCanvas.width} × ${mainCanvas.height}`;
            
            const resValEl = document.getElementById('resVal');
            if (resValEl) {
                resValEl.innerText = isFS ? `${resStr} (모니터 전체)` : `${resStr} (창 전체)`;
            }

            const modeInfoEl = document.getElementById('modeInfo');
            if (modeInfoEl) {
                modeInfoEl.innerText = isFS ? `🖥️ 모니터 전체화면 (${resStr})` : `창 전체화면 (${resStr})`;
            }

            const badgeFS = document.getElementById('badgeFS');
            if (badgeFS) {
                badgeFS.innerText = isFS ? "모니터 전체화면" : "화면 전체 캔버스";
            }
        }

        // -------------------------------------------------------------
        // 전체화면 (F11) 토글
        // -------------------------------------------------------------
        async function toggleFullscreen() {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                } else {
                    if (document.exitFullscreen) {
                        await document.exitFullscreen();
                    }
                }
            } catch (err) {
                console.warn('전체화면 전환 실패 또는 권한 필요:', err);
                showToast("F11 키를 눌러 모니터 전체화면으로 전환하세요.");
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const isFS = !!document.fullscreenElement;
            const fsIcon = document.getElementById('fsIcon');
            const fsText = document.getElementById('fsText');
            const btnFloatFS = document.getElementById('btnFloatFS');
            const btnToggleFS = document.getElementById('btnToggleFS');

            if (isFS) {
                if (fsIcon) fsIcon.innerText = '🗗';
                if (fsText) fsText.innerText = '창 모드 복귀 (F11)';
                if (btnFloatFS) btnFloatFS.classList.add('active-fs');
                if (btnToggleFS) btnToggleFS.innerText = '🗗 창 모드로 복귀 (F11)';
                showToast(`🖥️ 모니터 전체화면 캔버스 활성화 (${window.innerWidth} × ${window.innerHeight})`);
            } else {
                if (fsIcon) fsIcon.innerText = '🖥️';
                if (fsText) fsText.innerText = '모니터 전체화면 (F11)';
                if (btnFloatFS) btnFloatFS.classList.remove('active-fs');
                if (btnToggleFS) btnToggleFS.innerText = '🖥️ 모니터 전체화면 (F11)';
                showToast("창 모드로 복귀되었습니다.");
            }
            handleResize();
        });

        // -------------------------------------------------------------
        // UI 숨김/표시 토글 (단축키: Tab 또는 H)
        // -------------------------------------------------------------
        function toggleUI() {
            isUIHidden = !isUIHidden;
            document.body.classList.toggle('ui-hidden', isUIHidden);

            const icon = document.getElementById('uiToggleIcon');
            const text = document.getElementById('uiToggleText');

            if (isUIHidden) {
                if (icon) icon.innerText = '👁️';
                if (text) text.innerText = 'UI 보이기 (Tab)';
                showToast("UI 숨김 활성화 (Tab / H 키로 언제든 복귀)");
            } else {
                if (icon) icon.innerText = '🕶️';
                if (text) text.innerText = 'UI 숨기기 (Tab)';
                showToast("UI 표시 모드");
            }
            setTimeout(updateAreaCoords, 100);
        }

        // 토스트 알림 표시
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        // 도구 변경 (펜 / 지우개)
        function setTool(tool) {
            currentTool = tool;
            document.getElementById('btnPen').classList.toggle('active', tool === 'pen');
            document.getElementById('btnEraser').classList.toggle('active', tool === 'eraser');

            // 지우개 모드 시 상태 피드백 (지우개는 항상 100% 완전 불투명 화이트로 완벽 소거)
            const opValEl = document.getElementById('opacityVal');
            if (opValEl) {
                if (tool === 'eraser') {
                    opValEl.innerText = '100% (지우개 고정)';
                } else {
                    opValEl.innerText = `${Math.round(currentOpacity * 100)}%`;
                }
            }

            // 혹시 남아있을 수 있는 드래프트 정리
            draftCtx.clearRect(0, 0, draftCanvas.width, draftCanvas.height);

            updateBrushPreview();
        }

        // 굵기 변경 (슬라이더, 넘버 박스, 프리셋 양방향 동기화)
        function updateSize(size) {
            let val = parseInt(size);
            if (isNaN(val) || val < 1) val = 1;
            if (val > 300) val = 300;
            currentSize = val;

            const slider = document.getElementById('sizeSlider');
            if (slider) slider.value = Math.min(currentSize, 80);

            const input = document.getElementById('sizeInput');
            if (input && document.activeElement !== input) {
                input.value = currentSize;
            }

            const valEl = document.getElementById('sizeVal');
            if (valEl) valEl.innerText = `${currentSize} px`;

            [1, 4, 10, 24, 48].forEach(s => {
                const el = document.getElementById(`size${s}`);
                if (el) el.classList.toggle('active', s === currentSize);
            });

            updateBrushPreview();
        }

        // 투명도 변경 (슬라이더, 넘버 박스, 프리셋 양방향 동기화)
        function updateOpacity(val) {
            let num = parseInt(val);
            if (isNaN(num) || num < 1) num = 1;
            if (num > 100) num = 100;
            currentOpacity = num / 100.0;

            const slider = document.getElementById('opacitySlider');
            if (slider) slider.value = num;

            const input = document.getElementById('opacityInput');
            if (input && document.activeElement !== input) {
                input.value = num;
            }

            const opValEl = document.getElementById('opacityVal');
            if (opValEl) {
                if (currentTool === 'eraser') {
                    opValEl.innerText = '100% (지우개 고정)';
                } else {
                    opValEl.innerText = `${num}%`;
                }
            }

            [25, 50, 75, 100].forEach(op => {
                const el = document.getElementById(`op${op}`);
                if (el) el.classList.toggle('active', op === num);
            });

            // 드래프트 캔버스에 투명도 동기화
            draftCanvas.style.opacity = currentOpacity;
            updateBrushPreview();
        }

        // 색상 변경
        function setColor(hex, el = null) {
            currentColor = hex;
            document.getElementById('customColor').value = hex;

            document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
            if (el) {
                el.classList.add('active');
            }

            // 색상 선택 시 자동으로 펜 모드로 복귀
            if (currentTool === 'eraser') {
                setTool('pen');
            }

            updateBrushPreview();
        }

        // 브러시 미리보기 업데이트
        function updateBrushPreview() {
            const preview = document.getElementById('brushPreview');
            preview.style.width = `${Math.min(currentSize, 40)}px`;
            preview.style.height = `${Math.min(currentSize, 40)}px`;
            // 지우개는 항상 100% 불투명 원형으로 표시
            preview.style.opacity = (currentTool === 'eraser') ? '1.0' : currentOpacity;
            preview.style.backgroundColor = (currentTool === 'eraser') ? '#ffffff' : currentColor;
            preview.style.border = (currentTool === 'eraser') ? '2px dashed #94a3b8' : 'none';
        }

        // 캔버스 모두 초기화
        function clearCanvas() {
            draftCtx.clearRect(0, 0, draftCanvas.width, draftCanvas.height);
            mainCtx.fillStyle = '#ffffff';
            mainCtx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
            totalStrokes = 0;
            totalPoints = 0;
            document.getElementById('strokeCount').innerText = '0';
            document.getElementById('pointCount').innerText = '0';
            saveState();
            showToast("캔버스가 초기화되었습니다.");
        }

        // 실행 취소 (Undo)
        function undo() {
            draftCtx.clearRect(0, 0, draftCanvas.width, draftCanvas.height);
            if (historyStack.length > 1) {
                redoStack.push(historyStack.pop());
                const snap = historyStack[historyStack.length - 1];
                mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
                mainCtx.drawImage(snap, 0, 0);
                showToast("↩ 실행 취소");
            }
        }

        // 다시 실행 (Redo)
        function redo() {
            draftCtx.clearRect(0, 0, draftCanvas.width, draftCanvas.height);
            if (redoStack.length > 0) {
                const snap = redoStack.pop();
                historyStack.push(snap);
                mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
                mainCtx.drawImage(snap, 0, 0);
                showToast("↪ 다시 실행");
            }
        }

        // 캔버스 마우스 좌표 변환 (전체화면 1:1 매핑)
        function getCanvasPos(e) {
            const rect = mainCanvas.getBoundingClientRect();
            const scaleX = mainCanvas.width / rect.width;
            const scaleY = mainCanvas.height / rect.height;
            return {
                x: Math.round((e.clientX - rect.left) * scaleX),
                y: Math.round((e.clientY - rect.top) * scaleY)
            };
        }

        // -------------------------------------------------------------
        // 스트로크 드로잉 엔진 (문제 1 & 문제 2 근본적 해결)
        // 1. 지우개: 항상 100% 완전 불투명(alpha=1.0) 흰색으로 메인 캔버스에 즉각 소거
        // 2. 펜: 드래프트 레이어에 100% 불투명으로 그려 캡 중첩 투명도 누적을 원천 차단하고,
        //        해당 스트로크 전체를 사용자 지정 투명도로 1회 블렌딩 합성
        // -------------------------------------------------------------
        function startDrawing(e) {
            if (e.button !== 0) return; // 좌클릭만 처리
            isDrawing = true;
            totalStrokes++;
            document.getElementById('strokeCount').innerText = totalStrokes;

            const pos = getCanvasPos(e);
            lastX = pos.x;
            lastY = pos.y;

            if (currentTool === 'eraser') {
                // [해결 1] 지우개는 어떤 상황에서도 투명도 없이 100% 완전한 흰색으로 메인 캔버스 소거!
                mainCtx.save();
                mainCtx.globalAlpha = 1.0;
                mainCtx.fillStyle = '#ffffff';
                mainCtx.strokeStyle = '#ffffff';
                mainCtx.lineWidth = currentSize;
                mainCtx.lineCap = 'round';
                mainCtx.lineJoin = 'round';
                mainCtx.beginPath();
                mainCtx.arc(pos.x, pos.y, currentSize / 2, 0, Math.PI * 2);
                mainCtx.fill();
                mainCtx.restore();
            } else {
                // [해결 2] 펜은 드래프트 레이어에 완전 불투명(alpha=1.0) 단색으로 그림
                // 화면 표시에는 CSS opacity를 주어 사용자에게 설정 투명도로 즉시 렌더링
                draftCtx.clearRect(0, 0, draftCanvas.width, draftCanvas.height);
                draftCanvas.style.opacity = currentOpacity;

                draftCtx.save();
                draftCtx.fillStyle = currentColor;
                draftCtx.strokeStyle = currentColor;
                draftCtx.lineWidth = currentSize;
                draftCtx.lineCap = 'round';
                draftCtx.lineJoin = 'round';
                draftCtx.beginPath();
                draftCtx.arc(pos.x, pos.y, currentSize / 2, 0, Math.PI * 2);
                draftCtx.fill();
                draftCtx.restore();
            }

            totalPoints++;
            document.getElementById('pointCount').innerText = totalPoints;
        }

        function drawMove(e) {
            // Hz 측정
            mouseEventsThisSecond++;
            const now = performance.now();
            if (now - lastSecondTime >= 1000) {
                document.getElementById('hzVal').innerText = mouseEventsThisSecond;
                mouseEventsThisSecond = 0;
                lastSecondTime = now;
            }

            const pos = getCanvasPos(e);
            document.getElementById('posInfo').innerText = `X: ${pos.x}, Y: ${pos.y}`;

            if (!isDrawing) return;

            if (currentTool === 'eraser') {
                // [해결 1] 지우개 드래그 시 100% 불투명 흰색으로 메인 캔버스에서 선을 완벽하게 삭제
                mainCtx.save();
                mainCtx.globalAlpha = 1.0;
                mainCtx.strokeStyle = '#ffffff';
                mainCtx.lineWidth = currentSize;
                mainCtx.lineCap = 'round';
                mainCtx.lineJoin = 'round';
                mainCtx.beginPath();
                mainCtx.moveTo(lastX, lastY);
                mainCtx.lineTo(pos.x, pos.y);
                mainCtx.stroke();
                mainCtx.restore();
            } else {
                // [해결 2] 점과 점 사이 연결선 그리기:
                // 드래프트 레이어는 불투명 1.0 상태이므로 마우스 주기가 느리거나 촘촘해도
                // 겹쳐진 원형 캡에 투명도가 누적되지 않고 완벽하게 하나의 균일한 선으로 유지됨!
                draftCtx.save();
                draftCtx.strokeStyle = currentColor;
                draftCtx.lineWidth = currentSize;
                draftCtx.lineCap = 'round';
                draftCtx.lineJoin = 'round';
                draftCtx.beginPath();
                draftCtx.moveTo(lastX, lastY);
                draftCtx.lineTo(pos.x, pos.y);
                draftCtx.stroke();
                draftCtx.restore();
            }

            lastX = pos.x;
            lastY = pos.y;

            totalPoints++;
            document.getElementById('pointCount').innerText = totalPoints;
        }

        function endDrawing() {
            if (!isDrawing) return;
            isDrawing = false;

            if (currentTool === 'pen') {
                // 마우스를 뗄 때, 드래프트 레이어에 그려진 완벽한 연속선을
                // 사용자가 지정한 불투명도로 메인 캔버스에 단 1회 블렌딩 합성!
                mainCtx.save();
                mainCtx.globalAlpha = currentOpacity;
                mainCtx.drawImage(draftCanvas, 0, 0);
                mainCtx.restore();

                // 다음 획을 위해 드래프트 레이어 비우기
                draftCtx.clearRect(0, 0, draftCanvas.width, draftCanvas.height);
            }

            saveState();
        }

        // 이벤트 리스너 등록
        mainCanvas.addEventListener('mousedown', startDrawing);
        window.addEventListener('mousemove', drawMove);
        window.addEventListener('mouseup', endDrawing);
        window.addEventListener('mouseleave', endDrawing);

        // 키보드 단축키
        window.addEventListener('keydown', (e) => {
            // F11: 모니터 전체화면 토글
            if (e.key === 'F11') {
                e.preventDefault();
                toggleFullscreen();
                return;
            }

            // Tab 또는 H: UI 토글
            if (e.key === 'Tab' || e.key.toLowerCase() === 'h') {
                e.preventDefault();
                toggleUI();
                return;
            }

            // Ctrl+S: WebP 저장
            if (e.ctrlKey && e.key.toLowerCase() === 's') {
                e.preventDefault();
                saveAsWebp();
                return;
            }

            // Ctrl+Z: 실행 취소
            if (e.ctrlKey && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                if (e.shiftKey) redo();
                else undo();
                return;
            }

            // Ctrl+Y: 다시 실행
            if (e.ctrlKey && e.key.toLowerCase() === 'y') {
                e.preventDefault();
                redo();
                return;
            }

            // 단일 키 (인풋 폼이 아닐 때)
            const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
            if (activeTag === 'input' || activeTag === 'textarea') return;

            if (!e.ctrlKey && !e.altKey && !e.metaKey) {
                if (e.key.toLowerCase() === 'e') {
                    setTool('eraser');
                } else if (e.key.toLowerCase() === 'b') {
                    setTool('pen');
                } else if (e.key.toLowerCase() === 'c') {
                    clearCanvas();
                }
            }
        });

        // CANVAS_AREA 자동 계산
        function updateAreaCoords() {
            const isFS = !!document.fullscreenElement;
            const screenLeft = (window.screenLeft !== undefined) ? window.screenLeft : (window.screenX || 0);
            const screenTop = (window.screenTop !== undefined) ? window.screenTop : (window.screenY || 0);

            let left, top, right, bottom;
            if (isFS) {
                left = Math.round(screenLeft);
                top = Math.round(screenTop);
                right = Math.round(left + window.innerWidth);
                bottom = Math.round(top + window.innerHeight);
            } else {
                const chromeHeight = Math.max(0, window.outerHeight - window.innerHeight);
                left = Math.round(screenLeft);
                top = Math.round(screenTop + chromeHeight);
                right = Math.round(left + window.innerWidth);
                bottom = Math.round(top + window.innerHeight);
            }

            const coordStr = `${left},${top},${right},${bottom}`;
            const areaEl = document.getElementById('areaCoords');
            if (areaEl) areaEl.innerText = coordStr;
            return coordStr;
        }

        // 좌표 클립보드 복사
        function copyAreaCoords() {
            const coords = updateAreaCoords();
            navigator.clipboard.writeText(coords).then(() => {
                showToast(`📋 CANVAS_AREA 복사됨: ${coords}`);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = coords;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast(`📋 CANVAS_AREA 복사됨: ${coords}`);
            });
        }

        // WebP 이미지 저장
        function saveAsWebp() {
            if (isDrawing) endDrawing();
            mainCanvas.toBlob((blob) => {
                if (!blob) {
                    showToast("WebP 저장 실패");
                    return;
                }
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `gartic_${mainCanvas.width}x${mainCanvas.height}_${Date.now()}.webp`;
                a.click();
                URL.revokeObjectURL(url);
                showToast(`🌐 WebP 저장 완료 (${mainCanvas.width}×${mainCanvas.height})`);
            }, 'image/webp', 0.95);
        }

        // PNG 이미지 저장
        function saveAsPng() {
            if (isDrawing) endDrawing();
            const link = document.createElement('a');
            link.download = `gartic_${mainCanvas.width}x${mainCanvas.height}_${Date.now()}.png`;
            link.href = mainCanvas.toDataURL('image/png');
            link.click();
            showToast(`💾 PNG 저장 완료 (${mainCanvas.width}×${mainCanvas.height})`);
        }

        // 시작
        initCanvas();
        updateBrushPreview();
    </script>
</body>
</html>
